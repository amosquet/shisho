<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suggested Books - Shisho</title>
    
    <!-- Google Fonts: Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script>
        // Avoid FOUC for dark mode
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-white dark:bg-gray-950 min-h-screen flex flex-col font-sans transition-colors duration-200">
    
    <!-- Theme Toggle Button -->
    <button id="theme-toggle" type="button" class="absolute top-4 right-4 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-400 dark:focus:ring-indigo-500 text-sm p-2.5 transition-colors shadow-sm" aria-label="Toggle Theme">
        <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
        <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
    </button>

    <main class="grow flex flex-col items-center py-12 px-4 mt-8 sm:mt-0 max-w-3xl mx-auto w-full">
        <div class="flex justify-between items-end w-full mb-8 border-b border-gray-100 dark:border-gray-800 pb-4">
            <div>
                <h1 class="text-4xl font-bold text-gray-900 dark:text-white">Suggested Books</h1>
                <p class="text-gray-600 dark:text-gray-400 mt-2">Books suggested by the community.</p>
            </div>
            <a href="index.html" class="bg-black text-white dark:bg-white dark:text-black font-semibold px-4 py-2 transition-colors hover:bg-gray-800 dark:hover:bg-gray-200">
                + New Suggestion
            </a>
        </div>

        <!-- Dynamic Error Alert -->
        <div id="error-alert" class="hidden w-full bg-red-100 dark:bg-red-900/30 border border-red-300 dark:border-red-800 text-red-800 dark:text-red-400 p-4 mb-6"></div>

        <!-- Suggestions List Container -->
        <div id="suggestions-container" class="w-full space-y-4">
            <div id="loading-state" class="text-center py-12 text-gray-500 dark:text-gray-400">
                Loading suggestions...
            </div>
        </div>
    </main>

    <script>
        // Configuration for Shisho API URL:
        // When hosted on GitHub Pages, set this to your Shisho Cloudflare Tunnel URL, e.g.:
        // window.SHISHO_API_URL = "https://api.shisho.yourdomain.com";
        const API_BASE_URL = window.SHISHO_API_URL || (window.location.protocol.startsWith('http') && !window.location.hostname.endsWith('github.io') ? '' : '');

        // Theme Toggle Logic
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            themeToggleLightIcon.classList.remove('hidden');
        } else {
            themeToggleDarkIcon.classList.remove('hidden');
        }

        document.getElementById('theme-toggle').addEventListener('click', function() {
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');

            if (localStorage.getItem('color-theme')) {
                if (localStorage.getItem('color-theme') === 'light') {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                }
            } else {
                if (document.documentElement.classList.contains("dark")) {
                    document.documentElement.classList.remove("dark");
                    localStorage.setItem("color-theme", "light");
                } else {
                    document.documentElement.classList.add("dark");
                    localStorage.setItem("color-theme", "dark");
                }
            }
        });

        // Fetch and Render Suggestions
        async function loadSuggestions() {
            const container = document.getElementById("suggestions-container");
            const errorAlert = document.getElementById("error-alert");
            errorAlert.className = "hidden";
            errorAlert.textContent = "";

            try {
                const endpoint = `${API_BASE_URL.replace(/\/$/, '')}/api/books/suggestions`;
                const res = await fetch(endpoint);
                if (!res.ok) {
                    throw new Error(`HTTP error ${res.status}`);
                }
                const data = await res.json();
                const books = data.books || [];

                if (books.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-12 bg-gray-50 dark:bg-gray-900 border border-dashed border-gray-200 dark:border-gray-800">
                            <p class="text-gray-500 dark:text-gray-400">No books have been suggested yet!</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = books.map(book => {
                    const title = escapeHtml(book.title || (book.isbn ? `ISBN: ${book.isbn}` : "Unknown Book"));
                    const author = book.author ? `<p class="text-gray-600 dark:text-gray-400 font-medium">by ${escapeHtml(book.author)}</p>` : "";
                    const message = book.message ? `<p class="text-sm text-gray-700 dark:text-gray-300 italic mt-1 bg-white dark:bg-gray-950 p-2.5 border border-gray-100 dark:border-gray-800">"${escapeHtml(book.message)}"</p>` : "";
                    
                    const dateTag = book.date_suggested ? `<span>Suggested on ${escapeHtml(book.date_suggested.split(' ')[0])}</span>` : "";
                    const sourceTag = book.suggested_from ? `<span class="text-blue-500 dark:text-indigo-400 font-semibold">via ${escapeHtml(book.suggested_from)}</span>` : "";
                    const isbnTag = book.isbn ? `<span class="bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-400 px-2 py-0.5 text-xs font-mono">ISBN: ${escapeHtml(book.isbn)}</span>` : "";
                    
                    const coverImg = book.cover_url ? `<img src="${escapeHtml(book.cover_url)}" alt="${title}" class="w-16 h-24 object-cover shrink-0 border border-gray-200 dark:border-gray-700" loading="lazy" />` : "";

                    return `
                        <div class="bg-gray-50 dark:bg-gray-900 p-5 border border-gray-100 dark:border-gray-800 hover:border-blue-200 dark:hover:border-indigo-700 transition-colors shadow-sm flex gap-4 items-start">
                            ${coverImg}
                            <div class="flex-1 flex flex-col gap-1">
                                <h2 class="text-xl font-bold text-gray-900 dark:text-gray-100">${title}</h2>
                                ${author}
                                ${message}
                                <div class="flex flex-wrap items-center gap-3 mt-2 text-sm text-gray-400 dark:text-gray-500">
                                    ${dateTag}
                                    ${sourceTag}
                                    ${isbnTag}
                                </div>
                            </div>
                        </div>
                    `;
                }).join("");

            } catch (err) {
                container.innerHTML = "";
                errorAlert.className = "w-full bg-red-100 dark:bg-red-900/30 border border-red-300 dark:border-red-800 text-red-800 dark:text-red-400 p-4 mb-6";
                errorAlert.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span>Failed to load suggestions. Could not reach Shisho API.</span>
                        <button onclick="loadSuggestions()" class="underline font-semibold ml-4">Retry</button>
                    </div>
                `;
            }
        }

        function escapeHtml(text) {
            if (!text) return "";
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadSuggestions();
    </script>
</body>
</html>
